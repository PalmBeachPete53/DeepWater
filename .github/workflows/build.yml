# Builds Deepwater on a GitHub macOS machine and packs it as a .dmg (Apple silicon). The .dmg is in the run's
# "Artifacts" (kept 5 days); a tag v* also publishes it in a GitHub Release. Locally, the same packaging is
# `cmake --build build --target dist` (README › Packaging). The Windows job (MSVC, NSIS .exe, smoke test) was
# dropped on 2026-11-02 to keep development on macOS only; it is in git history (commit 7a4ba3f) to bring back.
name: Build

on:
  push:
    branches: [main, 'ci/**']
    tags: ['v*']
  workflow_dispatch:

# A newer push on the same branch cancels the run in progress (the Actions minutes of a private repo are counted).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.12.0
  QT_MODULES: qtwebengine qtwebchannel qtpositioning qtwebsockets qthttpserver qtmultimedia

jobs:
  macos:
    name: macOS (.dmg)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.1-${GITHUB_SHA::7}"; fi
          echo "PKG_VERSION=$v" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DDEEPWATER_PACKAGE_VERSION="$PKG_VERSION"

      - name: Build and package
        run: cmake --build build --target dist --parallel 4

      - uses: actions/upload-artifact@v4
        with:
          name: deepwater-macos
          path: build/dist/*.dmg
          retention-days: 5
          compression-level: 0
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Deepwater $GITHUB_REF_NAME" --generate-notes
