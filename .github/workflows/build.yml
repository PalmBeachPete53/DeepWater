# Builds Deepwater on GitHub's machines and packs it: an installer .exe on Windows, a .dmg on macOS (Apple silicon on a
# branch push, Apple silicon + Intel for a tag v* or a run started by hand). The packages are in the run's "Artifacts"
# (kept 5 days); a tag v* also publishes them in a GitHub Release. Locally, the same packaging on macOS is
# `cmake --build build --target dist` (README › Packaging).
name: Build

on:
  push:
    branches: [main, 'ci/**']
    tags: ['v*']
  workflow_dispatch:

# A newer push on the same branch cancels the run in progress (the Actions minutes of a private repo are counted).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.12.0
  QT_MODULES: qtwebengine qtwebchannel qtpositioning qtwebsockets qthttpserver qtmultimedia

jobs:
  macos:
    name: macOS (.dmg)
    # Windows work on ci/windows doesn't wait for a Mac.
    if: github.ref != 'refs/heads/ci/windows'
    runs-on: macos-26   # the reader's translator needs the macOS 26 SDK
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.1-${GITHUB_SHA::7}"; fi
          echo "PKG_VERSION=$v" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "ARCHS=arm64;x86_64" >> "$GITHUB_ENV"
          else
            echo "ARCHS=arm64" >> "$GITHUB_ENV"
          fi

      - name: Rust target for the Intel half
        if: contains(env.ARCHS, 'x86_64')
        run: rustup target add x86_64-apple-darwin

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_OSX_ARCHITECTURES="$ARCHS" -DDEEPWATER_PACKAGE_VERSION="$PKG_VERSION"

      - name: Build and package
        run: cmake --build build --target dist --parallel 4

      - uses: actions/upload-artifact@v4
        with:
          name: deepwater-macos
          path: build/dist/*.dmg
          retention-days: 5
          compression-level: 0
          if-no-files-found: error

  windows:
    name: Windows 11 (.exe)
    runs-on: windows-2025   # the same base as Windows 11 24H2
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.1-${GITHUB_SHA::7}"; fi
          echo "PKG_VERSION=$v" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # Not 6.12.0: its WebEngine for MSVC dates from July, its qtbase from September, and they don't load together
          # (a constructor became protected, which MSVC writes into the symbol). Checked: 6.11.3's pieces match.
          version: 6.11.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          # Qt 6.11+ splits its Windows repository by compiler (qt6_6120/qt6_6120_msvc2022_64/), which aqtinstall
          # 3.3.0, the last release on PyPI, can't read: aqtinstall's master has the fix (PR #1000), pinned here.
          # Back to the default once aqtinstall 3.4 is out.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7

      # zlib (the World Bank / USDA / JODI zip archives), static so there is no DLL to ship.
      - name: Install zlib
        shell: pwsh
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install zlib:x64-windows-static-md'

      # CPack's NSIS generator needs makensis, the build Ninja; the runner image normally has both.
      - name: Check NSIS and Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      # glslc, the headers and the loader, for the local engine's GPU backend (llama.cpp's Vulkan).
      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          $v = '1.4.363.1'
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe" -OutFile vulkan-sdk.exe
          Start-Process .\vulkan-sdk.exe -Wait -ArgumentList '--root', "C:\VulkanSDK\$v", '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          if (-not (Test-Path "C:\VulkanSDK\$v\Bin\glslc.exe")) { throw "no glslc in the SDK" }
          "VULKAN_SDK=C:\VulkanSDK\$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C:\VulkanSDK\$v\Bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      # The x64 MSVC environment (what the "x64 Native Tools Command Prompt" sets) for the next steps.
      - name: MSVC environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
                -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      # A cache of compilations, so that a run only recompiles what changed (a full build takes about 25 minutes).
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Use the cache
        shell: pwsh
        run: |
          "SCCACHE_GHA_ENABLED=true" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # Ninja rather than MSBuild: with -k 0 it compiles every file even after errors, so one run shows them all.
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DDEEPWATER_PACKAGE_VERSION="$env:PKG_VERSION"
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DDEEPWATER_LTO=OFF

      - name: Build and package
        id: package
        run: cmake --build build --target dist -- -k 0

      # Before the smoke test, so that a package exists whatever the test says.
      - uses: actions/upload-artifact@v4
        with:
          name: deepwater-windows
          path: |
            build/dist/*.exe
            ${{ startsWith(github.ref, 'refs/tags/') && 'build/dist/*.zip' || '' }}
          retention-days: 5
          compression-level: 0
          if-no-files-found: error

      - name: The packed DLLs fit together
        shell: pwsh
        run: |
          $dir = (Get-ChildItem build/dist/_CPack_Packages/win64/ZIP -Directory | Select-Object -First 1).FullName
          python tools/check_pe_imports.py "$dir"

      # The local engine, from the packed folder: refused the network and the user's files inside its sandbox, and able to
      # load and run a small model there.
      - name: Local engine in its sandbox
        id: engine
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = (Get-ChildItem build/dist/_CPack_Packages/win64/ZIP -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$dir\deepwater-llm.exe")) { throw "deepwater-llm.exe isn't in the packed folder" }
          $secret = Join-Path $env:USERPROFILE "deepwater-sandbox-secret.txt"
          "secret" | Out-File $secret
          $log = "$PWD\build\dist\sandbox.log"
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $p = Start-Process "$dir\deepwater.exe" -PassThru -Wait -RedirectStandardError $log -ArgumentList '--llm-sandbox-check', "`"$secret`""
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "the sandbox let something through, or didn't start (exit $($p.ExitCode))" }
          $model = Join-Path $env:USERPROFILE "stories260K.gguf"
          Invoke-WebRequest https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf -OutFile $model
          $log = "$PWD\build\dist\engine.log"
          $p = Start-Process "$dir\deepwater.exe" -PassThru -Wait -RedirectStandardError $log -ArgumentList '--llm-check', "`"$model`""
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "the model didn't run in the sandbox (exit $($p.ExitCode))" }
          # This machine has no GPU driver: the engine must have settled on the CPU.
          if (-not (Select-String -Path $log -Pattern '"devices":\["CPU"\]' -Quiet)) { throw "without a driver the engine should be on the CPU alone" }

          # A software Vulkan driver stands in for a graphics card: Vulkan's whole path, inside the sandbox.
          $m = '26.2.6'
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$m/mesa3d-$m-release-msvc.7z" -OutFile mesa.7z
          7z x mesa.7z -omesa -y | Out-Null
          $lvp = "$env:ProgramFiles\lavapipe"
          New-Item -ItemType Directory $lvp -Force | Out-Null
          Copy-Item mesa\x64\* $lvp -Recurse
          $icd = (Get-ChildItem $lvp -Filter 'lvp_icd*.json' | Select-Object -First 1).FullName
          "ICD: $icd"; Get-Content $icd
          New-Item -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers' -Name $icd -Value 0 -PropertyType DWord -Force | Out-Null
          $log = "$PWD\build\dist\engine-vulkan.log"
          $p = Start-Process "$dir\deepwater.exe" -PassThru -Wait -RedirectStandardError $log -ArgumentList '--llm-check', "`"$model`""
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "the model didn't run on Vulkan in the sandbox (exit $($p.ExitCode))" }
          if (-not (Select-String -Path $log -Pattern '"Vulkan' -Quiet)) { throw "the engine didn't use the Vulkan driver" }

          # The CPU mode, what a driver that crashes falls back on, must keep the driver out.
          $log = "$PWD\build\dist\engine-cpu.log"
          $env:DEEPWATER_LLM_CPU = '1'
          $p = Start-Process "$dir\deepwater.exe" -PassThru -Wait -RedirectStandardError $log -ArgumentList '--llm-check', "`"$model`""
          Remove-Item Env:DEEPWATER_LLM_CPU
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "the model didn't run in CPU mode (exit $($p.ExitCode))" }
          if (-not (Select-String -Path $log -Pattern '"devices":\["CPU"\]' -Quiet)) { throw "CPU mode still used the driver" }
          Remove-ItemProperty -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers' -Name $icd

      # The packed folder must run on its own: launch it with Qt off the PATH and no Qt variables, open the News
      # reader on a page (Qt WebEngine and its QtWebEngineProcess.exe on Windows), and take a screenshot.
      # Each check below tells something of its own: one failing doesn't hide the next.
      - name: Smoke test
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $dir = (Get-ChildItem build/dist/_CPack_Packages/win64/ZIP -Directory | Select-Object -First 1).FullName
          Get-ChildItem $dir | Format-Table -AutoSize Mode, Length, Name | Out-String -Width 200
          foreach ($f in 'deepwater.exe', 'deepwater-llm.exe', 'vulkan-1.dll', 'Qt6Core.dll', 'QtWebEngineProcess.exe', 'qt.conf', 'msvcp140.dll') {
            if (-not (Test-Path "$dir\$f")) { throw "$f isn't at the top of the packed folder" }
          }
          $fullPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH, Env:QT_ROOT_DIR -ErrorAction SilentlyContinue
          $shot = "$PWD\build\dist\smoke-windows.png"
          $log = "$PWD\build\dist\smoke-windows.log"
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $env:DEEPWATER_READER_LOG = '1'
          # This folder's access list keeps Chromium's sandboxed renderer from reading its DLLs (0xC0000135). The install below,
          # under Program Files, checks the reader with the sandbox on, as a user gets it.
          $env:QTWEBENGINE_DISABLE_SANDBOX = '1'
          $p = Start-Process "$dir\deepwater.exe" -PassThru -RedirectStandardError $log -ArgumentList `
               '--page', 'news', '--news-url', 'https://example.com', '--delay', '20000', '--screenshot', "`"$shot`""
          $null = $p.Handle   # without it, ExitCode stays empty after WaitForExit
          if (-not $p.WaitForExit(120000)) {
            # Stuck: what it says, what the screen shows, whether it got as far as the screenshot, and where its threads are.
            "Screenshot written: $(Test-Path $shot). CPU: $($p.TotalProcessorTime). Threads: $($p.Threads.Count)."
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\build\dist\smoke-desktop.png")
            $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
            if (Test-Path $cdb) { & $cdb -pv -p $p.Id -c "~*k 25; qd" 2>&1 | Select-Object -Last 220 } else { "no cdb" }
            $p.Kill()
            "--- its log"; Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 60
            throw "deepwater.exe didn't exit within 2 minutes"
          }
          "--- its log"; Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 60
          if ($p.ExitCode -ne 0) {
            # 0xC0000139 and its kin: a DLL that doesn't load. Windows' loader says which, under a debugger.
            $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64"
            if (Test-Path "$kits\cdb.exe") {
              & "$kits\gflags.exe" /i deepwater.exe +sls | Out-Null
              & "$kits\cdb.exe" -g -G -c "q" "$dir\deepwater.exe" 2>&1 |
                Select-String -Pattern 'ERROR|entry point|Procedure|was not found|failed' | Select-Object -Last 30
            } else { "no debugger on this machine" }
            throw "deepwater.exe exited with code $($p.ExitCode)"
          }
          if (-not (Test-Path $shot)) { throw "no screenshot" }
          if (-not (Select-String -Path $log -Pattern 'Example Domain' -Quiet)) { throw "the reader didn't render the page" }
          "Screenshot: $((Get-Item $shot).Length) bytes"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: |
            build/dist/smoke-windows.png
            build/dist/smoke-windows.log
            build/dist/smoke-desktop.png
          retention-days: 5
          if-no-files-found: ignore

      # What a user does: run the installer, then start the app from where it put it. Silent here, since no one can click.
      - name: The installer installs
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $exe = (Get-ChildItem build/dist/*.exe | Select-Object -First 1).FullName
          "Installer: $exe, $([math]::Round((Get-Item $exe).Length / 1MB)) MB"
          $i = Start-Process $exe -ArgumentList '/S' -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "the installer exited with code $($i.ExitCode)" }
          $home_ = Get-ChildItem "$env:ProgramFiles" -Directory -Filter 'Deepwater*' | Select-Object -First 1
          if (-not $home_) { throw "nothing installed under Program Files" }
          "Installed in $($home_.FullName)"
          foreach ($f in 'deepwater.exe', 'deepwater-llm.exe', 'Uninstall.exe') {
            if (-not (Test-Path "$($home_.FullName)\$f")) { throw "$f wasn't installed" }
          }
          $menu = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter '*Deepwater*.lnk' -ErrorAction SilentlyContinue
          "Start menu: $($menu.Name -join ', ')"
          if (-not $menu) { throw "no Start menu shortcut" }
          $out = "$PWD\build\dist\installed-version.txt"
          $v = Start-Process "$($home_.FullName)\deepwater.exe" -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput $out
          "--version: $(Get-Content $out) (exit $($v.ExitCode))"
          if ($v.ExitCode -ne 0) { throw "the installed app doesn't start" }
          $shot = "$PWD\build\dist\smoke-installed.png"
          $p = Start-Process "$($home_.FullName)\deepwater.exe" -PassThru -ArgumentList '--page', 'overview', '--delay', '15000', '--screenshot', "`"$shot`""
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "the installed app didn't finish its screenshot" }
          if (-not (Test-Path $shot)) { throw "the installed app took no screenshot (exit $($p.ExitCode))" }
          # The reader, with Chromium's sandbox on and a user's PATH: a real page must render.
          $fullPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH, Env:QT_ROOT_DIR, Env:QTWEBENGINE_DISABLE_SANDBOX -ErrorAction SilentlyContinue
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $env:DEEPWATER_READER_LOG = '1'
          $log = "$PWD\build\dist\smoke-reader.log"
          $reader = "$PWD\build\dist\smoke-reader.png"
          $r = Start-Process "$($home_.FullName)\deepwater.exe" -PassThru -RedirectStandardError $log -ArgumentList `
               '--page', 'news', '--news-url', 'https://example.com', '--delay', '20000', '--screenshot', "`"$reader`""
          $null = $r.Handle
          if (-not $r.WaitForExit(120000)) { $r.Kill(); throw "the installed reader didn't finish" }
          $env:PATH = $fullPath
          Get-Content $log | Select-String 'reader' | Select-Object -Last 8
          if (-not (Select-String -Path $log -Pattern 'Example Domain' -Quiet)) { throw "the installed reader didn't render the page" }
          if (Select-String -Path $log -Pattern 'Sandboxing disabled' -Quiet) { throw "the reader ran without Chromium's sandbox" }
          $u = Start-Process "$($home_.FullName)\Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          "Uninstaller exit: $($u.ExitCode)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-installed
          path: |
            build/dist/smoke-installed.png
            build/dist/smoke-reader.png
            build/dist/smoke-reader.log
          retention-days: 5
          if-no-files-found: ignore

      # The engine's check doesn't stop the others, but it counts.
      - name: Local engine's result
        if: ${{ steps.engine.outcome == 'failure' }}
        run: exit 1

  # What the app's update system reads: one release that always holds the latest build of main that succeeded. Its body
  # names the commit, in the form src/UpdateRelease.cpp parses. A tag made with this token starts no workflow.
  update-release:
    name: Update release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deepwater-macos
          path: artifact
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-main --cleanup-tag --yes || true
          notes="$(printf 'Latest build of main, for the update system.\n\ncommit: %s\ntime: %s\n' "$GITHUB_SHA" "$(git log -1 --format=%ct)")"
          gh release create latest-main artifact/*.dmg --prerelease --target "$GITHUB_SHA" \
            --title "Latest build of main" --notes "$notes"
      # Tells the running apps, which hold a WebSocket on this channel (src/Updater.cpp). It says nothing and isn't trusted:
      # they then ask GitHub. A failure here only means they learn of the build at their next start.
      - name: Tell the apps
        run: curl -fsS -m 20 -d 'new build' https://ntfy.sh/deepwater-updates-08dccc156782ea69cc5eb407 -o /dev/null || echo "::warning::ntfy.sh didn't take the signal"

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Deepwater $GITHUB_REF_NAME" --generate-notes
